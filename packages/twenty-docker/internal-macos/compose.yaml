name: crm-runtime

x-logging: &default-logging
  driver: json-file
  options:
    max-file: '5'
    max-size: 10m

x-twenty-environment: &twenty-environment
  NODE_PORT: '3000'
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/${PG_DATABASE_NAME}
  REDIS_URL: redis://redis:6379
  SERVER_URL: ${SERVER_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  STORAGE_TYPE: local
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
  APP_SECRET: ${APP_SECRET}
  DISABLE_DB_MIGRATIONS: 'false'
  DISABLE_CRON_JOBS_REGISTRATION: 'false'
  IS_MULTIWORKSPACE_ENABLED: 'false'
  AUTH_PASSWORD_ENABLED: 'true'
  AUTH_GOOGLE_ENABLED: 'false'
  AUTH_MICROSOFT_ENABLED: 'false'
  MESSAGING_PROVIDER_GMAIL_ENABLED: 'false'
  MESSAGING_PROVIDER_MICROSOFT_ENABLED: 'false'
  CALENDAR_PROVIDER_GOOGLE_ENABLED: 'false'
  CALENDAR_PROVIDER_MICROSOFT_ENABLED: 'false'

services:
  server:
    image: ${TWENTY_IMAGE:?TWENTY_IMAGE is required}
    pull_policy: never
    restart: always
    init: true
    environment: *twenty-environment
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  worker:
    image: ${TWENTY_IMAGE:?TWENTY_IMAGE is required}
    pull_policy: never
    restart: always
    init: true
    command: ['yarn', 'worker:prod']
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  db:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    restart: always
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${PG_DATABASE_USER} -d ${PG_DATABASE_NAME}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    restart: always
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?CLOUDFLARED_IMAGE is required}
    restart: always
    init: true
    read_only: true
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflared-token
    secrets:
      - cloudflared-token
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'cloudflared', 'tunnel', '--metrics', '127.0.0.1:2000', 'ready']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging: *default-logging

secrets:
  cloudflared-token:
    file: ./secrets/cloudflared-token

volumes:
  db-data:
  redis-data:
  server-local-data:
